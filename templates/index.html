<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronOS UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root {
            --bg: #080808;
            --c-idle: #546e7a;
            --c-listen: #3498db;
            --c-think: #2ecc71;
            --c-talk: #9b59b6;
            --c-work: #f1c40f;
        }
        body {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            background: var(--bg);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            color: white;
            user-select: none;
        }
        #pantalla1, #pantalla2 {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out;
        }
        #pantalla1 {
            background: var(--bg);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #pantalla1.oculto {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        #pantalla2 {
            background: #060606;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }
        #pantalla2.activo {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }
        .corner {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid rgba(52, 152, 219, 0.15);
            pointer-events: none;
        }
        .corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
        .btn-flotante {
            position: absolute; top: 14px; left: 14px;
            width: 34px; height: 34px; background: #111;
            border: 1px solid #2a3a42; border-radius: 7px;
            cursor: pointer; z-index: 100; transition: border 0.3s, box-shadow 0.3s;
        }
        .btn-flotante:hover { border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.3); }
        .badge-modelo {
            position: absolute; top: 20px; right: 38px;
            font-size: 8px; letter-spacing: 1.5px;
            color: #4da8da;
            border: 1px solid #2a5a75;
            border-radius: 3px; padding: 3px 6px;
        }
        .badge-version {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 9px; letter-spacing: 3px;
            color: #5d8aa8;
            text-transform: uppercase;
        }
        .core-container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
        .logo-tactil {
            position: relative; width: 350px; height: 350px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            transition: transform 0.2s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        
        .logo-tactil:hover { transform: scale(1.05); }
        .logo-tactil:active { transform: scale(0.92); }

        .aura {
            position: absolute; width: 350px; height: 350px;
            border-radius: 50%; pointer-events: none; transition: box-shadow 0.5s;
        }

        #logo-btn {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease;
        }
        #logo-btn:active {
            transform: scale(0.93);
        }
        .core-container.escuchando #logo-btn,
        .core-container.pensando #logo-btn,
        .core-container.hablando #logo-btn,
        .core-container.ejecutando #logo-btn {
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.85;
        }

        #btn-cancelar {
            display: none; 
            position: absolute; 
            bottom: 80px; 
            left: 50%;
            transform: translateX(-50%); 
            padding: 10px 20px;
            background: #ff0033; 
            color: white; 
            border-radius: 20px;
            cursor: pointer; 
            z-index: 101; 
            font-size: 12px;
        }
        .core-container.escuchando #btn-cancelar { 
            display: block !important; 
        }
        .logo-svg { width: 270px; height: 270px; position: relative; z-index: 2; }
        .logo-svg path { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s; }
        .info-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .estado-texto { font-size: 13px; letter-spacing: 5px; text-transform: uppercase; transition: color 0.3s; }
        .ecualizador { display: flex; gap: 4px; align-items: flex-end; height: 20px; }
        .barra { width: 3px; background: currentColor; border-radius: 1px; min-height: 3px; }
        #core.reposo .estado-texto, #core.reposo .barra { color: var(--c-idle); }
        #core.reposo .aura { box-shadow: 0 0 20px rgba(84,110,122,0.07); }
        #core.reposo .logo-svg path { stroke: var(--c-idle); stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw-path 3.5s infinite; }
        #core.reposo .logo-svg path:nth-child(1) { animation-delay: 0.07s; } #core.reposo .logo-svg path:nth-child(2) { animation-delay: 0.14s; }
        #core.reposo .logo-svg path:nth-child(3) { animation-delay: 0.21s; } #core.reposo .logo-svg path:nth-child(4) { animation-delay: 0.28s; }
        #core.reposo .logo-svg path:nth-child(5) { animation-delay: 0.35s; } #core.reposo .logo-svg path:nth-child(6) { animation-delay: 0.42s; }
        #core.reposo .logo-svg path:nth-child(7) { animation-delay: 0.49s; } #core.reposo .logo-svg path:nth-child(8) { animation-delay: 0.56s; }
        #core.reposo .logo-svg path:nth-child(9) { animation-delay: 0.63s; } #core.reposo .logo-svg path:nth-child(10) { animation-delay: 0.70s; }
        #core.reposo .logo-svg path:nth-child(11) { animation-delay: 0.77s; }
        @keyframes draw-path { 0%{stroke-dashoffset:900;opacity:0.15} 60%{stroke-dashoffset:0;opacity:1} 85%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:-900;opacity:0.15} }
        #core.reposo .barra { animation: eq-wave 3s infinite; }
        @keyframes eq-wave { 0%,100%{height:3px;opacity:0.4} 50%{height:9px;opacity:1} }
        #core.reposo .barra:nth-child(1){animation-delay:0s} #core.reposo .barra:nth-child(2){animation-delay:0.25s}
        #core.reposo .barra:nth-child(3){animation-delay:0.5s} #core.reposo .barra:nth-child(4){animation-delay:0.75s}
        #core.reposo .barra:nth-child(5){animation-delay:1s} #core.reposo .barra:nth-child(6){animation-delay:1.25s}
        #core.reposo .barra:nth-child(7){animation-delay:1.5s} #core.reposo .barra:nth-child(8){animation-delay:1.75s}
        #core.escuchando .estado-texto { color: var(--c-listen); animation: blink 1.4s infinite; }
        #core.escuchando .barra { color: var(--c-listen); }
        #core.escuchando .aura { animation: ap-b 1.4s infinite; }
        @keyframes ap-b { 0%,100%{box-shadow:0 0 20px rgba(52,152,219,0.1)} 50%{box-shadow:0 0 65px rgba(52,152,219,0.38)} }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
        #core.escuchando .logo-svg { animation: pendulum 2s ease-in-out infinite; }
        #core.escuchando .logo-svg path { stroke: var(--c-listen); }
        @keyframes pendulum { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
        #core.escuchando .barra { animation: eq-radar 1.2s infinite; }
        @keyframes eq-radar { 0%{height:3px;opacity:0.3} 35%{height:18px;opacity:1} 70%,100%{height:3px;opacity:0.3} }
        #core.escuchando .barra:nth-child(4), #core.escuchando .barra:nth-child(5) { animation-delay: 0s; }
        #core.escuchando .barra:nth-child(3), #core.escuchando .barra:nth-child(6) { animation-delay: 0.14s; }
        #core.escuchando .barra:nth-child(2), #core.escuchando .barra:nth-child(7) { animation-delay: 0.28s; }
        #core.escuchando .barra:nth-child(1), #core.escuchando .barra:nth-child(8) { animation-delay: 0.42s; }
        #core.pensando .estado-texto, #core.pensando .barra { color: var(--c-think); }
        #core.pensando .aura { animation: ap-g 1s infinite; }
        @keyframes ap-g { 0%,100%{box-shadow:0 0 20px rgba(46,204,113,0.08)} 50%{box-shadow:0 0 70px rgba(46,204,113,0.3)} }
        #core.pensando .logo-svg { animation: spin 9s linear infinite; }
        #core.pensando .logo-svg path { stroke: var(--c-think); }
        @keyframes spin { to{transform:rotate(360deg)} }
        #core.pensando .barra { animation: eq-sym 1.2s alternate infinite; }
        @keyframes eq-sym { from{height:3px} to{height:16px} }
        #core.pensando .barra:nth-child(1), #core.pensando .barra:nth-child(8) { animation-delay: 0s; }
        #core.pensando .barra:nth-child(2), #core.pensando .barra:nth-child(7) { animation-delay: 0.2s; }
        #core.pensando .barra:nth-child(3), #core.pensando .barra:nth-child(6) { animation-delay: 0.4s; }
        #core.pensando .barra:nth-child(4), #core.pensando .barra:nth-child(5) { animation-delay: 0.6s; }
        #core.hablando .estado-texto, #core.hablando .barra { color: var(--c-talk); }
        #core.hablando .aura { animation: ap-p 0.5s infinite; }
        @keyframes ap-p { 0%,100%{box-shadow:0 0 30px rgba(155,89,182,0.2)} 50%{box-shadow:0 0 80px rgba(155,89,182,0.5)} }
        #core.hablando .logo-svg { animation: triple-pulse 1.8s ease-in-out infinite; }
        #core.hablando .logo-svg path { stroke: var(--c-talk); }
        @keyframes triple-pulse { 0%{transform:scale(1)} 8%{transform:scale(1.08)} 16%{transform:scale(1)} 24%{transform:scale(1.05)} 32%{transform:scale(1)} 40%{transform:scale(1.1)} 48%{transform:scale(1)} 100%{transform:scale(1)} }
        #core.hablando .barra { animation: eq-silab 1.6s infinite; }
        @keyframes eq-silab { 0%,100%{height:3px;opacity:0.3} 25%{height:var(--h,14px);opacity:1} 50%{height:3px;opacity:0.3} }
        #core.hablando .barra:nth-child(1), #core.hablando .barra:nth-child(2) { animation-delay: 0s; --h: 14px; }
        #core.hablando .barra:nth-child(3), #core.hablando .barra:nth-child(4) { animation-delay: 0.4s; --h: 20px; }
        #core.hablando .barra:nth-child(5), #core.hablando .barra:nth-child(6) { animation-delay: 0.8s; --h: 10px; }
        #core.hablando .barra:nth-child(7), #core.hablando .barra:nth-child(8) { animation-delay: 1.2s; --h: 17px; }
        #core.ejecutando .estado-texto, #core.ejecutando .barra { color: var(--c-work); }
        #core.ejecutando .aura { animation: ap-y 0.7s infinite; }
        @keyframes ap-y { 0%,100%{box-shadow:0 0 15px rgba(241,196,15,0.08)} 50%{box-shadow:0 0 55px rgba(241,196,15,0.32)} }
        #core.ejecutando .logo-svg { animation: work-breath 0.9s ease-in-out infinite alternate; }
        #core.ejecutando .logo-svg path { stroke: var(--c-work); }
        @keyframes work-breath { from{transform:scale(0.94);opacity:0.6} to{transform:scale(1.05);opacity:1} }
        #core.ejecutando .barra { animation: eq-load 1.6s infinite; }
        @keyframes eq-load { 0%{height:3px;opacity:0.2} 20%{height:18px;opacity:1} 40%,100%{height:3px;opacity:0.2} }
        #core.ejecutando .barra:nth-child(1){animation-delay:0s} #core.ejecutando .barra:nth-child(2){animation-delay:0.2s}
        #core.ejecutando .barra:nth-child(3){animation-delay:0.4s} #core.ejecutando .barra:nth-child(4){animation-delay:0.6s}
        #core.ejecutando .barra:nth-child(5){animation-delay:0.8s} #core.ejecutando .barra:nth-child(6){animation-delay:1s}
        #core.ejecutando .barra:nth-child(7){animation-delay:1.2s} #core.ejecutando .barra:nth-child(8){animation-delay:1.4s}
        .p2-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 20px 24px 58px;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .punto-verde {
            width: 6px; height: 6px; border-radius: 50%;
            background: #2ecc71; box-shadow: 0 0 5px #2ecc71; animation: dpulse 2s infinite;
        }
        @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .sys-title { font-size: 9px; letter-spacing: 3px; color: #5d8aa8; text-transform: uppercase; } /* Antes #2a4a5a */
        .sys-clock { font-size: 9px; color: #4da8da; }
        .logs-area { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; font-size: 10px; line-height: 1.9; letter-spacing: 0.3px; }
        .log-line { display: flex; gap: 10px; }
        .log-ts { color: #3a8a5a; flex-shrink: 0; }
        .log-msg { color: #888; word-break: break-all; }
        .log-msg { color: #a3c2c2; word-break: break-all; }
        .log-tag { font-weight: bold; letter-spacing: 1px; }
        
        .log-tag.ok, .log-tag.boot { color: #39ff14; text-shadow: 0 0 5px #39ff14; } 
        .log-tag.sys, .log-tag.info { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .log-tag.stt, .log-tag.warn { color: #ffcc00; text-shadow: 0 0 5px #ffcc00; } 
        .log-tag.err, .log-tag.error, .log-tag.mic { color: #ff0033; text-shadow: 0 0 8px #ff0033; }
        .log-tag.tts, .log-tag.voz { color: #cc00ff; text-shadow: 0 0 5px #cc00ff; }
        .log-tag.llm { color: #00ff99; text-shadow: 0 0 5px #00ff99; } 
        
        .log-msg.sep { color: #1a2830; }
        .prompt-user { color: #4da8da; margin-right: 6px; font-weight: bold; }
        .cursor {
            display: inline-block; width: 7px; height: 11px;
            background: #2ecc71; animation: blink-step 0.8s step-end infinite;
            vertical-align: middle; margin-left: 4px;
        }
        @keyframes blink-step { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .res-panel {
            flex-shrink: 0; border-top: 1px solid #0f0f0f; display: grid;
            grid-template-columns: repeat(3, 1fr); padding: 15px 20px; gap: 15px;
        }
        .res-col { display: flex; flex-direction: column; gap: 4px; }
        .res-top { display: flex; justify-content: space-between; font-size: 9px; }
        .res-label { color: #a0a0a0; text-transform: uppercase; }        .c-cpu { color: #f1c40f; } .c-ram { color: #3498db; } .c-disk { color: #546e7a; }
        .res-bar-bg { width: 100%; height: 3px; background: #111; }
        .res-bar-fill { height: 100%; transition: width 0.3s; }
        .res-spark { width: 100px; height: 20px; opacity: 0.6; align-self: flex-start; margin-top: 2px;}
    </style>
</head>

        <div class="badge-modelo">QWEN2.5:3B</div>
        <div class="badge-version">CRONOS v1.3</div>
        <div class="core-container" id="core" class="reposo">

                <div class="res-bar-bg"><div class="res-bar-fill c-disk" style="width:0%" id="bar-disk"></div></div>
                <canvas class="res-spark" id="spark-disk" width="100" height="20"></canvas>
            </div>
        </div>
    </div>
    <script>
        const ctx1 = document.getElementById('btn-p1').getContext('2d');
        ctx1.strokeStyle = '#4a8aaa'; ctx1.lineWidth = 1.5; ctx1.lineCap = 'round'; ctx1.lineJoin = 'round';
        ctx1.beginPath();
        ctx1.moveTo(10,12); ctx1.lineTo(6,17); ctx1.lineTo(10,22);
        ctx1.moveTo(14,24); ctx1.lineTo(20,10);
        ctx1.moveTo(24,12); ctx1.lineTo(28,17); ctx1.lineTo(24,22);
        ctx1.stroke();
        const ctx2 = document.getElementById('btn-p2').getContext('2d');
        ctx2.strokeStyle = '#4a8aaa'; ctx2.lineWidth = 1.5; ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
        ctx2.beginPath();
        ctx2.moveTo(14,11); ctx2.lineTo(9,17); ctx2.lineTo(14,23);
        ctx2.moveTo(9,17); ctx2.lineTo(23,17);
        ctx2.stroke();
        const p1 = document.getElementById('pantalla1');
        const p2 = document.getElementById('pantalla2');
        document.getElementById('btn-p1').addEventListener('click', () => { p1.classList.add('oculto'); p2.classList.add('activo'); });
        document.getElementById('btn-p2').addEventListener('click', () => { p1.classList.remove('oculto'); p2.classList.remove('activo'); });
        setInterval(() => document.getElementById('reloj').innerText = new Date().toLocaleTimeString('es-ES', {hour12:false}), 1000);
        const core = document.getElementById('core');
        const label = document.getElementById('estado-label');
        function setEstado(estado) {
            core.className = 'core-container ' + estado;
            label.innerText = estado.toUpperCase();
        }
        function activarEscucha() {
            fetch('/activar_escucha', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    if (!data.ok) {
                        const logo = document.getElementById('logo-btn');
                        logo.style.transition = 'transform 0.08s ease-in-out';
                        logo.style.transform = 'scale(0.88)';
                        setTimeout(() => { logo.style.transform = 'scale(1)'; }, 160);
                    }
                })
                .catch(e => console.error(e));
        }

        function cancelarEscucha() {
            console.log("Cancelando...");
            fetch('/cancelar_escucha', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    console.log("Respuesta de cancelación:", data);
                })
                .catch(e => console.error("Error al cancelar:", e));
        }
        const logsContainer = document.getElementById('logs-container');
        const cursorLine = document.getElementById('cursor-line');
        function addLog(msg, tag="SYS") {
            const timeStr = new Date().toLocaleTimeString('es-ES', {hour12:false});
            const div = document.createElement('div'); div.className = 'log-line';
            
            let tagClass = tag.toLowerCase();
            if(tagClass === 'voz') tagClass = 'tts';
            
            let tagHtml = tag ? `<span class="log-tag ${tagClass}">[${tag}]</span>` : '';
            div.innerHTML = msg === '──' 
                ? `<span class="log-ts">${timeStr}</span> <span class="log-msg sep">─────────────────────────</span>`
                : `<span class="log-ts">${timeStr}</span> <span class="prompt-user">root@cronos:~$</span> ${tagHtml} <span class="log-msg">${msg}</span>`;
                
            logsContainer.insertBefore(div, cursorLine);
            logsContainer.scrollTop = logsContainer.scrollHeight;
            const MAX_LOGS = 150;
        while (logsContainer.children.length > MAX_LOGS + 1) {
            logsContainer.removeChild(logsContainer.firstChild);
        }
        }

        addLog("Iniciando Núcleo CronOS v1.3...", "BOOT");
        addLog("Conectando con Backend...", "SYS");

        const history = { cpu: [], ram: [], disk: [] };
        function drawSpark(id, data, color) {
            const canvas = document.getElementById(id); const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,100,20); if(data.length < 2) return;
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
            const step = 100 / 19;
            for(let i=0; i<data.length; i++) {
                const x = i * step, y = 20 - (data[i] / 100 * 20);
                i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
            }
            ctx.stroke();
        }

        const evtSource = new EventSource('/estado_sistema');
        evtSource.onmessage = function(e) {
            try {
                const data = JSON.parse(e.data);
                
                if(data.estado && !core.classList.contains(data.estado)) setEstado(data.estado);
                
                if(data.log) {
                    let tag = "SYS";
                    let msg = data.log;
                    
                    const match = data.log.match(/^\[(.*?)\]\s*(.*)/);
                    if (match) {
                        tag = match[1];
                        msg = match[2];
                    } else if (data.log.includes("ERROR")) {
                        tag = "ERR";
                    }

                    addLog(msg, tag);
                }

                document.getElementById('val-cpu').innerText = data.cpu + '%';
                document.getElementById('bar-cpu').style.width = data.cpu + '%';
                
                const ramPercent = Math.min((data.ram / 16) * 100, 100).toFixed(1);
                document.getElementById('val-ram').innerText = data.ram + 'GB';
                document.getElementById('bar-ram').style.width = ramPercent + '%';

                document.getElementById('val-disk').innerText = data.disco + 'GB';
                const discoMax = 100;
                const discoPercent = Math.min((1 - (data.disco / discoMax)) * 100, 100).toFixed(1);
                document.getElementById('bar-disk').style.width = discoPercent + '%';
                
                history.cpu.push(data.cpu); if(history.cpu.length > 20) history.cpu.shift();
                history.ram.push(parseFloat(ramPercent)); if(history.ram.length > 20) history.ram.shift();
                history.disk.push(parseFloat(discoPercent)); if(history.disk.length > 20) history.disk.shift();
                
                drawSpark('spark-cpu', history.cpu, '#f1c40f');
                drawSpark('spark-ram', history.ram, '#3498db');
                drawSpark('spark-disk', history.disk, '#546e7a');

            } catch(err) { console.error(err); }
        };
        evtSource.onerror = function() {
            if(Math.random() > 0.95) addLog("Buscando señal de servidor SSE...", "WARN");
        };
    </script>
</body>
</html>
